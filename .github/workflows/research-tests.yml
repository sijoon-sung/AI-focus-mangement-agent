name: Research tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: xvfb-run -a python -m unittest discover -s tests -p test_desktop.py -v
        env:
          PLANWISE_UI_TESTS: '1'
      - run: python -m research.smoke
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - run: python -m research.smoke_return
